# Keep connection details in the network menu, rather than the status bar.
general {
    output_format = "i3bar"
    colors = true
    color_good = "#a6d189"
    color_degraded = "#e5c890"
    color_bad = "#e78284"
    interval = 5
    separator = "  ·  "
}

order += "wireless _first_"
order += "disk /"
order += "memory"
order += "tztime local"

wireless _first_ {
    format_up = "Wi-Fi  %essid  %quality"
    format_down = "Wi-Fi  disconnected"
}

disk "/" {
    format = "Disk  %avail free"
}

memory {
    format = "RAM  %used"
    threshold_degraded = "1G"
    format_degraded = "RAM  %available free"
}

tztime local {
    format = "%a %b %d  %H:%M"
}
